[project]
name = "vlm-eval"
version = "0.1.0"
description = "Vision-Language Model evaluation harness for MMMU and similar benchmarks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "pillow>=10.0.0",
    "accelerate>=0.28.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "qwen-vl-utils>=0.0.14",
    "torchvision>=0.26.0",
    "pydantic>=2.13.4",
    "outlines>=1.2.13",
    "lm-format-enforcer>=0.11.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
